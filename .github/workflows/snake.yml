name: contribution snake

# Renders the contribution graph as an animated SVG and pushes it to the
# `output` branch. This runs in my own Actions, so it does not depend on
# someone else's free hosting — which is how the previous activity graph died.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%235EEAD4&color_dots=%23161B22,%231F3F3B,%232E6F66,%2344B0A3,%235EEAD4

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
